<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta name="description" content="Open Health Imaging Foundation DICOM Viewer" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1.0,minimum-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="cleartype" content="on" />
  <meta name="MobileOptimized" content="320" />
  <meta name="HandheldFriendly" content="True" />
  <meta name="apple-mobile-web-app-capable" content="yes" />


  <title>OHIF Standalone Viewer</title>
  <style>
    html, body {
      overflow-x: hidden !important;
      width: 100vw;
    }
    /* Make OHIF Toolbar horizontally scrollable on mobile */
    .ToolbarRow, .toolbarRow, .toolbar-row {
      overflow-x: auto !important;
      overflow-y: hidden !important;
      display: flex !important;
      flex-wrap: nowrap !important;
      -webkit-overflow-scrolling: touch;
      max-width: 100vw;
      /* Optional padding so the last item isn't cut off */
      padding-right: 15px; 
    }
    /* Hide scrollbar for a cleaner look */
    .ToolbarRow::-webkit-scrollbar, .toolbarRow::-webkit-scrollbar, .toolbar-row::-webkit-scrollbar {
      display: none;
    }

    /* Hide everything above the DICOM Viewer Menu (Toolbar) */
    .notification-bar,
    .entry-header,
    .ViewerHeader,
    .header-brand,
    .research-use {
      display: none !important;
    }
  </style>
</head>

<body>
  <noscript> You need to enable JavaScript to run this app. </noscript>

  <div id="root"></div>

  <script type="text/javascript" src="./app-config.js"></script>
  <script src="./index.umd.js" crossorigin></script>
  <script>
    var containerId = 'root';
    var componentRenderedOrUpdatedCallback = function () {
      console.log('OHIF Viewer rendered/updated');
    };
    window.OHIFViewer.installViewer(
      window.config, // See `/config/default.js`
      containerId,
      componentRenderedOrUpdatedCallback
    );
  </script>
</body>

</html>
